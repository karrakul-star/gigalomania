name: Gigalomania ARM64

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Prepare game
        run: |
          MAIN=android/Gigalomania/app/src/main
          cp *.cpp *.h "$MAIN/jni/src/"
          cp -r TinyXML "$MAIN/jni/src/"
          mkdir -p "$MAIN/assets"
          cp -r gfx islands music sound "$MAIN/assets/"
          EXTRA=$(find . -type d -name gfx_android_extras -print -quit)
          if [ -n "$EXTRA" ]; then
            cp -r "$EXTRA/." "$MAIN/assets/gfx/"
          fi
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          gfx = Path("android/Gigalomania/app/src/main/assets/gfx")
          for p in gfx.rglob("*"):
              if p.suffix.lower() in (".jpg", ".jpeg"):
                  target = p.with_suffix(".png")
                  if not target.exists():
                      Image.open(p).convert("RGB").save(target)
                      print("Converted:", target)
          for name in ("starfield.png", "stars.png"):
              p = gfx / name
              assert p.is_file(), f"Missing {name}"
              with Image.open(p) as im:
                  im.verify()
              print("Verified:", p)
          PY
          sed -i 's/register int i, j;/int i, j;/' "$MAIN/jni/src/utils.cpp"

      - name: Download SDL libraries
        run: |
          cd android/Gigalomania/app/src/main/jni
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL
          git clone --depth 1 --branch release-2.8.8 https://github.com/libsdl-org/SDL_image.git SDL_image
          git clone --depth 1 --branch release-2.8.1 https://github.com/libsdl-org/SDL_mixer.git SDL_mixer
          git -C SDL_mixer submodule update --init --recursive --depth 1
          git -C SDL_image submodule update --init --recursive --depth 1

      - name: Update SDL Java
        run: |
          MAIN=android/Gigalomania/app/src/main
          mkdir -p "$MAIN/java/org/libsdl/app"
          cp "$MAIN"/jni/SDL/android-project/app/src/main/java/org/libsdl/app/*.java "$MAIN/java/org/libsdl/app/"

      - name: Build APK
        working-directory: android/Gigalomania
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Verify APK
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = next(Path("android/Gigalomania/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              for name in ("assets/gfx/starfield.png", "assets/gfx/stars.png", "lib/arm64-v8a/libmain.so"):
                  assert name in z.namelist(), f"Missing {name}"
                  print("Verified:", name)
          print("APK verified:", apk)
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-log
          path: android/Gigalomania/build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gigalomania-ARM64
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
