name: Gigalomania ARM64

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Prepare game
        run: |
          MAIN=android/Gigalomania/app/src/main
          cp *.cpp *.h "$MAIN/jni/src/"
          cp -r TinyXML "$MAIN/jni/src/"
          mkdir -p "$MAIN/assets"
          cp -r gfx islands music sound "$MAIN/assets/"
          sed -i 's/register int i, j;/int i, j;/' "$MAIN/jni/src/utils.cpp"

      - name: Download SDL libraries
        run: |
          cd android/Gigalomania/app/src/main/jni
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL
          git clone --depth 1 --branch release-2.8.8 https://github.com/libsdl-org/SDL_image.git SDL_image
          git clone --depth 1 --branch release-2.8.1 https://github.com/libsdl-org/SDL_mixer.git SDL_mixer
          git -C SDL_mixer submodule update --init --recursive --depth 1
          git -C SDL_image submodule update --init --recursive --depth 1

      - name: Update SDL Java
        run: |
          MAIN=android/Gigalomania/app/src/main
          mkdir -p "$MAIN/java/org/libsdl/app"
          cp "$MAIN"/jni/SDL/android-project/app/src/main/java/org/libsdl/app/*.java "$MAIN/java/org/libsdl/app/"

      - name: Build APK
        working-directory: android/Gigalomania
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-log
          path: android/Gigalomania/build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gigalomania-ARM64
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
