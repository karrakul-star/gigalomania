apply plugin: 'com.android.application'

android {
    namespace 'net.sourceforge.gigalomania'
    compileSdkVersion 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId "net.sourceforge.gigalomania"
        minSdkVersion 23
        targetSdkVersion 36

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
}
